  <style>
    /* ----- BANNER CON IMAGEN LOCAL ----- */
    .main-banner {
      background-image: url('banner-bg.jpg') !important;
      background-size: cover !important;
      background-position: center !important;
      background-repeat: no-repeat !important;

    }
    .most-popular {

    }
    .heading-section {

    }

    /* ----- FUENTE DE PROGRAMACIÓN ----- */
    .btn-pdf {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-weight: 600;
    }

    /* ----- ESTILOS DE BOTONES (vertical, sin hover) ----- */
    .btn-pdf {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 30px;
      font-size: 0.8rem;
      text-decoration: none;
      border: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      cursor: pointer;
      width: 100%;
      color: #1e1e1e;
      transition: none;
    }
    .btn-pdf:hover {
      text-decoration: none;
      color: #1e1e1e;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 15px;
      width: 100%;
    }

    /* ----- COLORES POR IFRAME ----- */
    .item-1 .btn-pdf {
      background-color: #a8d5ff;
      color: #1e3a5f;
    }
    .item-2 .btn-pdf {
      background-color: #b0e57c;
      color: #2d4a1e;
    }
    .item-3 .btn-pdf {
      background-color: #ffd29b;
      color: #5a3d1a;
    }
    .item-4 .btn-pdf {
      background-color: #ffb3ba;
      color: #5a2a2e;
    }

    /* Ajuste de iframes */
    .item iframe {
      width: 100%;
      height: 250px;
      border: 1px solid #444;
      border-radius: 12px;
      background: #1e1e1e;
    }

    .item {
      background: #1f2122;
      padding: 20px 15px;
      border-radius: 23px;
      margin-bottom: 30px;
    }

    @media (max-width: 576px) {
      .btn-pdf {
        font-size: 0.7rem;
        padding: 6px 10px;
      }
    }
  </style>
</head>
